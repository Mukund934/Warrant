openapi: 3.1.0
info:
  title: Warrant control plane
  version: 0.1.0
  summary: Issue scope-bound mandates, decide actions against them, and produce evidence anyone can verify offline.
  description: >
    Every response body that carries a signature is a Warrant format with its own version string,
    independent of this API's version. `/v1` may change while `warrant/evidence-pack/v0.1` does not,
    and the reverse is also true. A relying party should pin the format, not the endpoint.

    Authentication is declared, not guessed. A deployment runs in one of two modes and reports
    which on `/health` as `auth`. In `open` mode there is no authentication and anyone can issue
    mandates under the published demonstration keys, which exist so that a reader can reproduce and
    forge packs for themselves. In `required` mode the authority endpoints need a bearer token
    issued by the identity provider named in `authIssuer`.

    Authentication decides who may call, never what the answer is. The verdict on an action is a
    function of the mandate chain and the signed evaluation inputs alone, so an offline verifier
    that has never seen the caller reproduces the same result. No endpoint below changes behaviour
    based on who is logged in.

    The verification endpoints and the demonstration scenarios are public in both modes. A relying
    party checking evidence must never need an account here.
servers:
  - url: /v1

tags:
  - name: mandates
    description: Issuance, delegation and revocation of authority.
  - name: actions
    description: Deciding an action against the authority presented with it.
  - name: organisations
    description: Who may act under which organisation, and in what role.
  - name: agents
    description: Machine identities, their keys and their lifecycle.
  - name: capabilities
    description: What an organisation's action names mean, and what they demand.
  - name: verification
    description: Relying-party operations. Nothing here requires trusting this service.

paths:
  /mandates:
    post:
      tags: [mandates]
      summary: Issue a root mandate
      description: The issuer must be a principal key. Authority granted here is the ceiling for every hop below it.
      security: [{ bearerAuth: [] }]
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "201": { description: The signed mandate, at depth 0. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "422": { description: The requested scope is not one this issuer may grant. }

  /mandates/{id}:
    get:
      tags: [mandates]
      summary: Read a mandate and the chain above it
      parameters: [{ $ref: "#/components/parameters/MandateId" }]
      security: [{ bearerAuth: [] }]
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "200": { description: The mandate and its ancestors, root first. }
        "404": { $ref: "#/components/responses/NotFound" }

  /mandates/{id}/authority:
    get:
      tags: [mandates]
      summary: What this chain confers, and what each hop changed
      description: >
        The effective scope once every hop is intersected, plus a hop-by-hop diff saying which fields
        each delegation narrowed and by how much.

        **Derived, never stored.** It is computed from mandates that are already signed, so it needs
        no new field and no format version. A relying party holding an evidence pack computes the
        identical diff offline with `warrant-verify diff` — this endpoint is a convenience, not the
        source of the answer.

        A hop marked `widened` claims more than the mandate above it holds. Issuance refuses to
        create one, so seeing it here means the chain did not come from this service.
      parameters: [{ $ref: "#/components/parameters/MandateId" }]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The chain, its effective scope, and one entry per hop. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /mandates/{id}/delegations:
    post:
      tags: [mandates]
      summary: Delegate a narrower mandate
      description: >
        Refused if the delegation would widen any dimension of scope, exceed the parent's validity
        window, or pass the maximum delegation depth. Absent fields inherit from the parent; they
        never widen.
      parameters: [{ $ref: "#/components/parameters/MandateId" }]
      security: [{ bearerAuth: [] }]
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "201": { description: The signed child mandate. }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: >
            `delegation_would_widen`, naming the dimension that failed, for example
            `scope/per_action_limit_exceeded`.

  /mandates/{id}/revocation:
    post:
      tags: [mandates]
      summary: Revoke a mandate
      description: Revocation is published as a signed snapshot carrying the moment it was taken.
      parameters: [{ $ref: "#/components/parameters/MandateId" }]
      security: [{ bearerAuth: [] }]
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "201": { description: The updated signed revocation snapshot. }
        "404": { $ref: "#/components/responses/NotFound" }

  /actions:
    post:
      tags: [actions]
      summary: Present an action for decision
      description: >
        Runs the full check pipeline and returns a signed decision plus an evidence pack. **A refused
        action is a 201, not an error** — a BLOCK is a successful decision and valid evidence. Only a
        malformed request is a 4xx.
      security: [{ bearerAuth: [] }]
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "201":
          description: The signed decision and its evidence pack. Verdict is ALLOW, BLOCK or ESCALATE.
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /actions/signed:
    post:
      tags: [actions]
      summary: Present an action the agent signed itself
      description: >
        For an agent whose private key this deployment does not hold, which is every registered agent.
        The body carries a complete `ActionRequest` with its own proof; the service records and decides
        it but does not sign it.

        **This is also the only endpoint that accepts a human approval.** An approval is bound to one
        request by its digest, so the approver must have the request in hand before signing - which is
        possible here and impossible on `/v1/actions`, where the service builds the request itself.
        Sending an `approval` to that endpoint is refused rather than ignored. The service never signs
        an approval on a human's behalf; if it did, the second-human check would mean nothing.

        This is where proof of possession becomes real. The signing key must resolve through the
        published trust roots and must be the subject key of the presenting mandate, so a request
        signed by anything else fails `request.signature` or `actor.possession`. The nonce is claimed
        from the presented request, so a replay is caught. And because `requestedAt` is now the agent's
        own timestamp rather than the moment the service received it, **the freshness window is
        load-bearing here for the first time** - a request signed too long ago is refused.

        A refused action is still a 201 with a BLOCK, as everywhere else.
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: The signed decision and its evidence pack. Verdict is ALLOW, BLOCK or ESCALATE.
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InsufficientRole" }
        "404": { $ref: "#/components/responses/NotFound" }

  /checkpoint:
    post:
      tags: [verification]
      summary: Take a signed checkpoint over the current ledger head
      description: >
        On demand only. Nothing schedules this. The checkpoint commits to the ledger's head digest
        and entry count, and is what would be submitted to an external transparency log — but
        anchoring is supplemental. **A checkpoint that was never anchored is still a valid signed
        commitment, and no authorization decision or verification depends on a log being reachable.**
      security: [{ bearerAuth: [] }]
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "201": { description: The signed checkpoint. }
        "422": { description: "`ledger_empty` — there is nothing to commit to yet." }

  /organisations:
    post:
      tags: [organisations]
      summary: Create an organisation and become its owner
      description: >
        Self-service. The authenticated caller becomes the owner. Authority is always recorded under
        an organisation, so an account that belongs to none cannot issue a mandate.
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: The organisation, with the caller's role. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { description: "`organisation_exists`." }
    get:
      tags: [organisations]
      summary: List the organisations this account belongs to
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The caller's organisations and role in each. }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /organisations/{id}/members:
    get:
      tags: [organisations]
      summary: List the members of an organisation
      description: Scoped to the caller's own organisation; another organisation reads as absent.
      parameters: [{ $ref: "#/components/parameters/OrganisationId" }]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The members and their roles. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [organisations]
      summary: Grant a role to an identity
      description: >
        Needs `admin` or `owner`. The identity is named by its subject at the configured provider,
        because this service cannot enumerate that provider's users.
      parameters: [{ $ref: "#/components/parameters/OrganisationId" }]
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: The membership that now exists. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InsufficientRole" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organisations/{id}/members/{accountId}/withdrawal:
    post:
      tags: [organisations]
      summary: Withdraw a membership
      description: Needs `admin` or `owner`. An account may not withdraw its own membership.
      parameters:
        - { $ref: "#/components/parameters/OrganisationId" }
        - { $ref: "#/components/parameters/AccountId" }
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: The membership is gone. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InsufficientRole" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "`last_owner`." }

  /agents:
    post:
      tags: [agents]
      summary: Register an agent
      description: >
        Needs `admin` or `owner`. The body carries the agent's **public** JWK only; a key containing a
        private component is refused rather than stripped, because a caller who sent one needs to know
        it is compromised. The key id is the RFC 7638 thumbprint, so an agent identity is its key.
        A registered agent starts `registered` and must be activated before it can act.
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: The registered agent. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InsufficientRole" }
        "422": { description: "`private_key_supplied`, `unsupported_key`, `agent_exists` or `key_already_registered`." }
    get:
      tags: [agents]
      summary: List this organisation's agents
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The agents registered to the caller's organisation. }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /agents/{id}:
    get:
      tags: [agents]
      summary: Read an agent and its current key id
      parameters: [{ $ref: "#/components/parameters/AgentId" }]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The agent, its lifecycle state and its current signing key id. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agents/{id}/status:
    post:
      tags: [agents]
      summary: Move an agent through its lifecycle
      description: >
        Needs `admin` or `owner`. Permitted moves are registered to active, active to suspended or
        revoked, suspended back to active or on to revoked, and revoked to archived. Revoked is final
        for acting; anything else is refused by name.

        **This never rewrites history.** The gate records the agent's state into the signed decision
        at the moment of the action, so an evidence pack issued while the agent was active keeps
        reproducing ALLOW after the agent is suspended. Suspension stops future actions; it is not a
        second revocation mechanism, and mandate revocation remains separate.
      parameters: [{ $ref: "#/components/parameters/AgentId" }]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The agent in its new state. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InsufficientRole" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "`transition_refused` or `already_in_state`, naming what was permitted." }

  /agents/{id}/key-rotation:
    post:
      tags: [agents]
      summary: Replace an agent's signing key
      description: >
        Needs `admin` or `owner`. The retired key keeps a `signingUntil` and stays published, so
        evidence it signed before the rotation still verifies. Refused for a revoked or archived agent.
      parameters: [{ $ref: "#/components/parameters/AgentId" }]
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: The new key id and the moment it became the signing key. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InsufficientRole" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "`private_key_supplied`, `unsupported_key` or `transition_refused`." }

  /house-scope:
    post:
      tags: [organisations]
      summary: Set the ceiling above every mandate this organisation issues
      description: >
        Needs `admin` or `owner`. The body carries one `Scope`. From then on
        `effective_authority = chain_scope ∩ house_scope`, and a meet can only subtract — the ceiling
        can never grant an action, raise a limit or reopen a counterparty list the mandate closed.

        **Enforced twice, by the same rule both times.** Issuance refuses a mandate that would exceed
        the ceiling, using `narrows` — the identical function that refuses a widening delegation. And
        the ceiling in force at the moment of an action is written into the signed decision, so a
        stranger reproduces the verdict offline without holding it, and tightening the ceiling later
        cannot reach back and change a verdict already reached.

        Setting a ceiling binds immediately. There is no advisory mode, because a ceiling nobody
        enforces is not a ceiling.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The ceiling now in force. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InsufficientRole" }
    get:
      tags: [organisations]
      summary: Read this organisation's ceiling
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "The ceiling, or `scope: null` if none was ever set." }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /house-scope/withdrawal:
    post:
      tags: [organisations]
      summary: Remove the ceiling
      description: >
        Needs `admin` or `owner`. Future actions are judged on the delegated authority alone.
        Decisions already recorded keep the ceiling that was in force when they were made.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: The ceiling no longer applies. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InsufficientRole" }

  /capabilities:
    post:
      tags: [capabilities]
      summary: Register a capability
      description: >
        Needs `admin` or `owner`. A capability gives an action name a definition: a risk level, a
        declared shape, and optionally an approval threshold. Ids are lower-case and qualified, like
        `payment.execute`.

        **The catalogue is consulted by the gate, never carried in the mandate.** `Scope.actions`
        stays an array of strings, so every mandate issued before the catalogue existed keeps working
        and no signed format changed. What the gate found is written into the signed decision, which
        is how a stranger reproduces a catalogue-driven verdict without holding the catalogue.
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: The registered capability. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InsufficientRole" }
        "422": { description: "`capability_id_rejected`, `capability_contradicts_itself` or `capability_exists`." }
    get:
      tags: [capabilities]
      summary: List this organisation's capabilities
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The capabilities registered to the caller's organisation. }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /capabilities/enforcement:
    post:
      tags: [capabilities]
      summary: Choose whether the catalogue refuses or only observes
      description: >
        Needs `admin` or `owner`. `advisory` is the default and never changes a verdict — an
        unregistered capability is recorded as a warning. `required` makes the catalogue binding, so
        an action this organisation does not define is refused.

        An organisation that has registered no capability at all is not consulted in either mode.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The catalogue's enforcement mode and how many capabilities it holds. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InsufficientRole" }
    get:
      tags: [capabilities]
      summary: Read the catalogue's enforcement mode
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The enforcement mode and the size of the catalogue. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /capabilities/{id}:
    get:
      tags: [capabilities]
      summary: Read one capability
      parameters: [{ $ref: "#/components/parameters/CapabilityId" }]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The capability as this organisation defines it. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /capabilities/{id}/status:
    post:
      tags: [capabilities]
      summary: Deprecate, withdraw or restore a capability
      description: >
        Needs `admin` or `owner`. Active may become deprecated or withdrawn, deprecated may return to
        active or be withdrawn, and withdrawn is final.

        **Withdrawal is not a second revocation mechanism.** Like agent suspension, it changes what
        the gate records at the moment of a future action; it never rewrites a decision already made,
        and evidence issued while the capability was registered keeps reproducing its verdict.
      parameters: [{ $ref: "#/components/parameters/CapabilityId" }]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: The capability in its new state. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/InsufficientRole" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "`transition_refused` or `already_in_state`, naming what was permitted." }

  /trust-roots:
    get:
      tags: [verification]
      summary: The public keys this deployment signs with
      description: >
        Public halves only. Keys carry an optional signing lifecycle; a key outside its signing
        window cannot sign new artifacts but everything it already signed stays verifiable.
      responses:
        "200": { description: An array of trust roots. Never contains private key material. }

  /verify:
    post:
      tags: [verification]
      summary: Verify an evidence pack
      description: >
        Offered as a convenience. It is not the trustworthy way to verify — a relying party should
        run the standalone verifier against keys it obtained itself, because asking the issuer whether
        its own evidence is good proves nothing.
      responses:
        "200":
          description: >
            A verification report. `result` is VERIFIED or INVALID and answers whether the evidence
            is genuine; `authority` explains the verdict and is a finding, not a fault.
        "400": { $ref: "#/components/responses/InvalidRequest" }

  /evidence/{id}:
    get:
      tags: [verification]
      summary: Fetch a stored evidence pack
      parameters: [{ $ref: "#/components/parameters/PackId" }]
      responses:
        "200": { description: The evidence pack. }
        "404": { $ref: "#/components/responses/NotFound" }

  /scenarios:
    get:
      tags: [verification]
      summary: List the deterministic demonstration scenarios
      responses:
        "200": { description: Scenario identifiers, questions and expected verdicts. }

  /scenarios/{id}:
    get:
      tags: [verification]
      summary: Read one demonstration scenario
      parameters: [{ $ref: "#/components/parameters/ScenarioId" }]
      responses:
        "200": { description: The scenario with its chain, request, decision and pack. }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    MandateId:
      name: id
      in: path
      required: true
      schema: { type: string }
    PackId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ScenarioId:
      name: id
      in: path
      required: true
      schema: { type: string }
    OrganisationId:
      name: id
      in: path
      required: true
      schema: { type: string }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string }
    CapabilityId:
      name: id
      in: path
      required: true
      schema: { type: string }
    AgentId:
      name: id
      in: path
      required: true
      schema: { type: string }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        An ES256 access token from the configured identity provider, checked against its published
        JWKS. Only ES256 is accepted, so a public key cannot be replayed as an HMAC secret. Claims
        under `user_metadata` are user-writable and are never read.

  responses:
    InvalidRequest:
      description: "`invalid_request`, with a per-field list of what failed."
    NotFound:
      description: "`not_found`."
    Unauthenticated:
      description: "`unauthenticated`, with a `WWW-Authenticate: Bearer` header. Only in `required` mode."
    InsufficientRole:
      description: "`insufficient_role`, naming the role the action needs and the one the account holds."
